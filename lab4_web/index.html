<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная №4 — Растровые алгоритмы</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1e1e1e;
        color: #fff;
        padding: 20px;
        min-height: 100vh;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 1.8em;
      }

      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        background: #2d2d2d;
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 16px;
      }

      .controls label {
        font-size: 0.9em;
      }

      .controls input[type="number"] {
        width: 70px;
        padding: 6px 8px;
        background: #3d3d3d;
        color: #fff;
        border: 1px solid #555;
        border-radius: 4px;
        font-size: 0.9em;
      }

      .controls select {
        padding: 6px 8px;
        background: #3d3d3d;
        color: #fff;
        border: 1px solid #555;
        border-radius: 4px;
        font-size: 0.9em;
      }

      .controls input[type="range"] {
        width: 120px;
      }

      .controls button {
        padding: 8px 16px;
        background: #3b82f6;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9em;
      }

      .controls button:hover {
        background: #2563eb;
      }

      .controls button.clear {
        background: #6b7280;
      }

      .controls button.clear:hover {
        background: #4b5563;
      }

      canvas {
        display: block;
        width: 100%;
        height: 600px;
        background: #2d2d2d;
        border-radius: 8px;
        cursor: crosshair;
      }

      .status {
        margin-top: 16px;
        padding: 12px 16px;
        background: #2d2d2d;
        border-radius: 8px;
        font-family: "Courier New", monospace;
        font-size: 0.95em;
      }
    </style>
  </head>
  <body>
    <h1>Лабораторная №4 — Базовые растровые алгоритмы</h1>

    <div class="controls">
      <label>X1: <input type="number" id="x1" value="0" step="1" /></label>
      <label>Y1: <input type="number" id="y1" value="0" step="1" /></label>
      <label>X2: <input type="number" id="x2" value="100" step="1" /></label>
      <label>Y2: <input type="number" id="y2" value="100" step="1" /></label>
      <label>R: <input type="number" id="radius" value="30" step="1" /></label>

      <select id="algorithm">
        <option value="step">Пошаговый</option>
        <option value="dda">ЦДА</option>
        <option value="bresenham">Брезенхем (линия)</option>
      </select>

      <button id="drawLine">Нарисовать линию</button>
      <button id="drawCircle">Нарисовать окружность</button>

      <label
        >Масштаб: <input type="range" id="scale" min="1" max="5" value="2"
      /></label>

      <button id="clear" class="clear">Очистить</button>
    </div>

    <canvas id="canvas"></canvas>

    <div class="status" id="status">Готов к работе</div>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const status = document.getElementById("status");

      const x1Input = document.getElementById("x1");
      const y1Input = document.getElementById("y1");
      const x2Input = document.getElementById("x2");
      const y2Input = document.getElementById("y2");
      const radiusInput = document.getElementById("radius");
      const algorithmSelect = document.getElementById("algorithm");
      const scaleSlider = document.getElementById("scale");

      const drawLineBtn = document.getElementById("drawLine");
      const drawCircleBtn = document.getElementById("drawCircle");
      const clearBtn = document.getElementById("clear");

      let offsetX = 0;
      let offsetY = 0;
      let gridSize = 10;

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        offsetX = canvas.width / 2;
        offsetY = canvas.height / 2;
        redraw();
      }

      function getCell() {
        return gridSize * parseInt(scaleSlider.value);
      }

      function drawGrid() {
        const cell = getCell();
        ctx.strokeStyle = "#555";
        ctx.lineWidth = 1;

        for (let x = offsetX; x < canvas.width; x += cell) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (let x = offsetX; x > 0; x -= cell) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }

        for (let y = offsetY; y < canvas.height; y += cell) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
        for (let y = offsetY; y > 0; y -= cell) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
      }

      function drawAxes() {
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(0, offsetY);
        ctx.lineTo(canvas.width, offsetY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(offsetX, 0);
        ctx.lineTo(offsetX, canvas.height);
        ctx.stroke();
      }

      function drawLabels() {
        const cell = getCell();
        const step = 5;

        ctx.fillStyle = "#fff";
        ctx.font = "bold 14px Arial";
        ctx.textAlign = "center";

        for (
          let x = offsetX + cell * step;
          x < canvas.width;
          x += cell * step
        ) {
          const coord = (x - offsetX) / cell;
          ctx.fillText(coord.toString(), x, offsetY - 8);
        }
        for (let x = offsetX - cell * step; x > 0; x -= cell * step) {
          const coord = (x - offsetX) / cell;
          ctx.fillText(coord.toString(), x, offsetY - 8);
        }

        for (let y = offsetY - cell * step; y > 0; y -= cell * step) {
          const coord = (offsetY - y) / cell;
          ctx.fillText(coord.toString(), offsetX + 20, y + 5);
        }
        for (
          let y = offsetY + cell * step;
          y < canvas.height;
          y += cell * step
        ) {
          const coord = (offsetY - y) / cell;
          ctx.fillText(coord.toString(), offsetX + 20, y + 5);
        }

        ctx.font = "bold 16px Arial";
        ctx.fillText("X", canvas.width - 15, offsetY - 10);
        ctx.fillText("Y", offsetX + 15, 20);
        ctx.fillText("0", offsetX - 15, offsetY + 20);
      }

      function drawPixel(x, y, color) {
        const cell = getCell();
        const screenX = offsetX + x * cell;
        const screenY = offsetY - y * cell;

        ctx.fillStyle = color;
        ctx.fillRect(screenX - cell / 2, screenY - cell / 2, cell, cell);
      }

      function stepAlgorithm(x1, y1, x2, y2) {
        const points = [];
        const dx = x2 - x1;
        const dy = y2 - y1;
        const steps = Math.max(Math.abs(dx), Math.abs(dy));

        if (steps === 0) return [{ x: x1, y: y1 }];

        const xInc = dx / steps;
        const yInc = dy / steps;
        let x = x1;
        let y = y1;

        for (let i = 0; i <= steps; i++) {
          points.push({ x: Math.round(x), y: Math.round(y) });
          x += xInc;
          y += yInc;
        }
        return points;
      }

      function ddaAlgorithm(x1, y1, x2, y2) {
        const points = [];
        const dx = x2 - x1;
        const dy = y2 - y1;
        const length = Math.max(Math.abs(dx), Math.abs(dy));

        if (length === 0) return [{ x: x1, y: y1 }];

        const dxInc = dx / length;
        const dyInc = dy / length;
        let x = x1;
        let y = y1;

        for (let i = 0; i <= length; i++) {
          points.push({ x: Math.round(x), y: Math.round(y) });
          x += dxInc;
          y += dyInc;
        }
        return points;
      }

      function bresenhamLine(x1, y1, x2, y2) {
        const points = [];
        const dx = Math.abs(x2 - x1);
        const dy = Math.abs(y2 - y1);
        const sx = x1 < x2 ? 1 : -1;
        const sy = y1 < y2 ? 1 : -1;
        let err = dx - dy;
        let x = x1;
        let y = y1;

        while (true) {
          points.push({ x, y });
          if (x === x2 && y === y2) break;

          const e2 = 2 * err;
          if (e2 > -dy) {
            err -= dy;
            x += sx;
          }
          if (e2 < dx) {
            err += dx;
            y += sy;
          }
        }
        return points;
      }

      function bresenhamCircle(cx, cy, radius) {
        const points = [];
        let x = 0;
        let y = radius;
        let d = 3 - 2 * radius;

        function addPoints(px, py) {
          points.push({ x: cx + px, y: cy + py });
          points.push({ x: cx + py, y: cy + px });
          points.push({ x: cx - px, y: cy + py });
          points.push({ x: cx - py, y: cy + px });
          points.push({ x: cx + px, y: cy - py });
          points.push({ x: cx + py, y: cy - px });
          points.push({ x: cx - px, y: cy - py });
          points.push({ x: cx - py, y: cy - px });
        }

        while (x <= y) {
          addPoints(x, y);
          if (d < 0) {
            d = d + 4 * x + 6;
          } else {
            d = d + 4 * (x - y) + 10;
            y -= 1;
          }
          x += 1;
        }
        return points;
      }

      function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();
        drawAxes();
        drawLabels();
      }

      drawLineBtn.addEventListener("click", () => {
        const x1 = parseInt(x1Input.value);
        const y1 = parseInt(y1Input.value);
        const x2 = parseInt(x2Input.value);
        const y2 = parseInt(y2Input.value);
        const algorithm = algorithmSelect.value;

        const start = performance.now();

        let points;
        if (algorithm === "step") points = stepAlgorithm(x1, y1, x2, y2);
        else if (algorithm === "dda") points = ddaAlgorithm(x1, y1, x2, y2);
        else points = bresenhamLine(x1, y1, x2, y2);

        for (const p of points) {
          drawPixel(p.x, p.y, "#fff");
        }

        const end = performance.now();
        const duration = (end - start) * 1000;

        status.textContent = `Время: ${duration.toFixed(1)} мкс. Точек: ${points.length}`;
      });

      drawCircleBtn.addEventListener("click", () => {
        const cx = parseInt(x1Input.value);
        const cy = parseInt(y1Input.value);
        const radius = parseInt(radiusInput.value);

        const start = performance.now();

        const points = bresenhamCircle(cx, cy, radius);

        for (const p of points) {
          drawPixel(p.x, p.y, "#ff4444");
        }

        const end = performance.now();
        const duration = (end - start) * 1000;

        status.textContent = `Время: ${duration.toFixed(1)} мкс. Точек: ${points.length}`;
      });

      clearBtn.addEventListener("click", () => {
        redraw();
        status.textContent = "Готов к работе";
      });

      scaleSlider.addEventListener("input", () => {
        redraw();
      });

      window.addEventListener("resize", resizeCanvas);

      resizeCanvas();
    </script>
  </body>
</html>

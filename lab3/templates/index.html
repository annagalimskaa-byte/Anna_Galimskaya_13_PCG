<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная №3 — Пороговая обработка</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Лабораторная №3 — Пороговая обработка</h1>
        <p>Реализация методов: Оцу, Итеративный, Адаптивный</p>
    </header>

    <main>
        <div class="controls">
            <label class="btn">
                📂 Открыть изображение
                <input type="file" id="fileInput" accept="image/*" hidden>
            </label>

            <label for="methodSelect">Метод:</label>
            <select id="methodSelect">
                <option value="otsu">Оцу (глобальный)</option>
                <option value="iterative">Итеративный (глобальный)</option>
                <option value="adaptive">Адаптивный</option>
            </select>

            <button id="processBtn" class="btn primary">⚙️ Обработать</button>
            <button id="saveBtn" class="btn" disabled>💾 Скачать</button>
        </div>

        <div class="panels">
            <div class="panel">
                <h2>Исходное</h2>
                <div class="image-container">
                    <img id="originalImg" alt="Исходное изображение">
                    <p class="placeholder" id="originalPlaceholder">Изображение не загружено</p>
                </div>
            </div>

            <div class="panel">
                <h2>Обработанное</h2>
                <div class="image-container">
                    <img id="processedImg" alt="Обработанное изображение">
                    <p class="placeholder" id="processedPlaceholder">Нажмите «Обработать»</p>
                </div>
            </div>
        </div>

        <div id="status" class="status">Готов к работе</div>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
